name: Optain
description: 'Optain (Optain Health) is a healthcare technology company delivering AI-powered
  retinal imaging and oculomics for early, non-invasive detection of chronic disease at
  the point of care. Its platform pairs the FDA 510(k)-cleared Resolve robotic fundus
  camera and Eyetelligence Assure Software as a Medical Device (SaMD) with teleophthalmology
  grading to screen for diabetic retinopathy, glaucoma, age-related macular degeneration,
  hypertensive retinopathy and cardiovascular risk in seconds, without dilation. Rooted in
  Australian-founded Eyetelligence (2019) and research from the Centre for Eye Research
  Australia, Optain integrates with major EHR systems and returns ICD-10-coded reports,
  typically same day. Backed by Insight Partners. No public developer API surface is
  currently published.'
